name: Build e publicar QMoney

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    env:
      QMONEY_VERSION: ${{ github.event.release.tag_name || '1.0.0' }}

    steps:
      - uses: actions/checkout@v4

      - name: Normalizar versão
        shell: pwsh
        run: |
          "QMONEY_VERSION=$($env:QMONEY_VERSION.TrimStart('v'))" >> $env:GITHUB_ENV

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências Python
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Instalar Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true

      - name: Compilar interface nativa
        shell: pwsh
        run: |
          cmake -S desktop -B build-ci -G "Visual Studio 17 2022" -A x64
          cmake --build build-ci --config Release --parallel

      - name: Empacotar serviço local
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          playwright install chromium
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name QMoneyService --paths $root `
            --icon "$root/desktop/resources/qmoney.ico" `
            --distpath release/pyinstaller --workpath release/pyinstaller-work `
            --specpath packaging --collect-data moneymin --collect-all curl_cffi `
            --collect-submodules playwright --collect-submodules boto3 `
            --collect-submodules ego4d `
            --add-data "$root/moneymin/iphone_uw_calibration.json;moneymin" `
            --add-data "$root/moneymin/native_metadata_reference.json;moneymin" `
            --add-data "$root/moneymin/resources;moneymin/resources" `
            --add-data "$root/reference;reference" `
            "$root/packaging/qmoney_service.py"

      - name: Montar distribuição
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/QMoney/runtime | Out-Null
          Copy-Item build-ci/Release/QMoney.exe release/QMoney/
          Copy-Item build-ci/Release/QMoneyUpdater.exe release/QMoney/
          Copy-Item release/pyinstaller/QMoneyService.exe release/QMoney/runtime/
          windeployqt --release --no-translations --compiler-runtime release/QMoney/QMoney.exe

          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile release/ffmpeg.zip
          Expand-Archive release/ffmpeg.zip release/ffmpeg
          New-Item -ItemType Directory -Force release/QMoney/runtime/tools/ffmpeg/bin | Out-Null
          Copy-Item (Get-ChildItem release/ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName release/QMoney/runtime/tools/ffmpeg/bin/
          Copy-Item (Get-ChildItem release/ffmpeg -Recurse -Filter ffprobe.exe | Select-Object -First 1).FullName release/QMoney/runtime/tools/ffmpeg/bin/
          Copy-Item "$env:LOCALAPPDATA/ms-playwright" release/QMoney/runtime/ms-playwright -Recurse

          Compress-Archive -Path release/QMoney/* -DestinationPath release/QMoney-windows-x64.zip -CompressionLevel Optimal
          $hash = (Get-FileHash release/QMoney-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  QMoney-windows-x64.zip" | Set-Content release/QMoney-windows-x64.zip.sha256 -Encoding ascii
          if (-not $env:QMONEY_UPDATE_PRIVATE_KEY) {
            throw "Configure o secret QMONEY_UPDATE_PRIVATE_KEY com a chave RSA privada."
          }
          $rsa = [System.Security.Cryptography.RSA]::Create()
          try {
            $rsa.ImportFromPem($env:QMONEY_UPDATE_PRIVATE_KEY)
            $signature = $rsa.SignHash(
              [Convert]::FromHexString($hash),
              [System.Security.Cryptography.HashAlgorithmName]::SHA256,
              [System.Security.Cryptography.RSASignaturePadding]::Pkcs1)
            [System.IO.File]::WriteAllText(
              "release/QMoney-windows-x64.zip.sig",
              [Convert]::ToBase64String($signature),
              [System.Text.Encoding]::ASCII)
          } finally {
            $rsa.Dispose()
          }
        env:
          QMONEY_UPDATE_PRIVATE_KEY: ${{ secrets.QMONEY_UPDATE_PRIVATE_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: QMoney-windows-x64
          path: |
            release/QMoney-windows-x64.zip
            release/QMoney-windows-x64.zip.sha256
            release/QMoney-windows-x64.zip.sig

      - name: Anexar arquivos à release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/QMoney-windows-x64.zip
            release/QMoney-windows-x64.zip.sha256
            release/QMoney-windows-x64.zip.sig
